name: bus-booking-platform-production

x-application: &application
  image: bus-booking-api:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file: ${API_ENV_FILE:-./apps/api/production.env}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '4000'
  depends_on:
    postgres:
      condition: service_healthy
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in production.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in production.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production.env}
    volumes:
      - postgres_production_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    <<: *application
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'

  email-worker:
    <<: *application
    command: [node, dist/workers/emailWorker.js]
    healthcheck:
      disable: true

  booking-worker:
    <<: *application
    command: [node, dist/workers/bookingHoldWorker.js]
    healthcheck:
      disable: true

  auth-worker:
    <<: *application
    command: [node, dist/workers/authCleanupWorker.js]
    healthcheck:
      disable: true

  payment-worker:
    <<: *application
    profiles: [payments]
    command: [node, dist/workers/paymentWorker.js]
    healthcheck:
      disable: true

  refund-worker:
    <<: *application
    profiles: [refunds]
    command: [node, dist/workers/refundWorker.js]
    healthcheck:
      disable: true

  migrate:
    image: bus-booking-migrations:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrations
    env_file: ${API_ENV_FILE:-./apps/api/production.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

volumes:
  postgres_production_data:
