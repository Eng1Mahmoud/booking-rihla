name: Application CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: API, web and dashboard quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint application code
        run: npm run lint

      - name: Check API TypeScript
        run: npm run typecheck

      - name: Build API
        run: npm run build

      - name: Check web TypeScript
        run: npm run typecheck:web

      - name: Build web
        run: npm run build:web
        env:
          API_BASE_URL: http://127.0.0.1:4000/api/v1
          SITE_ORIGIN: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Check dashboard TypeScript
        run: npm run typecheck:dashboard

      - name: Build dashboard
        run: npm run build:dashboard
        env:
          API_BASE_URL: http://127.0.0.1:4000/api/v1
          SITE_ORIGIN: http://localhost:3001
          PASSENGER_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
